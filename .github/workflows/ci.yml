name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'specs/**', '.claude/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'specs/**', '.claude/**']
  workflow_dispatch:

# 同一分支上新的推送取消尚未跑完的旧运行，省 Actions 分钟数。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  csharp:
    name: C# 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 缓存 NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('csharp/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 还原
        run: dotnet restore csharp/RIoT.Sdk.sln

      - name: 构建
        run: dotnet build csharp/RIoT.Sdk.sln -c Release --no-restore

      - name: 测试
        run: dotnet test csharp/RIoT.Sdk.Tests -c Release --no-build --logger "console;verbosity=normal"

  python:
    name: Python 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        working-directory: python
        run: pip install -e ".[dev]"

      - name: 测试
        working-directory: python
        run: pytest tests -v
