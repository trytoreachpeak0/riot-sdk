name: publish

# Packs RIoT.Sdk.Core, RIoT.Sdk.Generated and RIoT.Sdk.Facade from main and,
# only when asked, pushes them to GitHub Packages:
# https://nuget.pkg.github.com/trytoreachpeak0/index.json
#
# Manual trigger only. A push or a pull request never runs this file, and the
# default run (push unchecked) builds, tests, packs and checks without
# publishing anything. Before checking "push", the product owner has approved
# this exact version and file list.
#
# The only credential is this run's GITHUB_TOKEN (packages: write). No
# long-lived key or secret exists for publishing. Each package names this
# repository in RepositoryUrl, so GitHub links it here and it takes this
# repository's access settings. A new package starts private; do not make it
# public (that cannot be undone).
on:
  workflow_dispatch:
    inputs:
      push:
        description: Push the packages to GitHub Packages (unchecked = build, test, pack and check only)
        type: boolean
        default: false

# Never cancel a running job here (see test.yml): a second run waits.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # The same runner as test.yml; it is the only runner of this repository.
    runs-on: [self-hosted, headless]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    defaults:
      run:
        shell: pwsh

    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      FEED: https://nuget.pkg.github.com/trytoreachpeak0/index.json

    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          Write-Output "::error::Packages are published from main only; this run is on $env:GITHUB_REF."
          exit 1

      # Actions are pinned by commit SHA: this job holds a token that can publish.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: dotnet --info
        run: dotnet --info

      # Judged by exit codes only: the runner's locale is zh-CN.
      - name: Test
        run: dotnet test csharp/RIoT.Sdk.Tests -c Release

      - name: Pack
        run: dotnet pack csharp/RIoT.Sdk.sln -c Release -o "$env:RUNNER_TEMP/packages"

      # Also the network check: asks nuget.pkg.github.com, through whatever proxy
      # the runner uses, whether this version exists. A run that cannot reach the
      # feed fails here, before anything is pushed.
      - name: Check packages
        env:
          NUGET_FEED_TOKEN: ${{ github.token }}
        run: pwsh -File scripts/check-packages.ps1 -PackageDirectory "$env:RUNNER_TEMP/packages" -CheckFeed -FeedUrl $env:FEED

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: ${{ runner.temp }}/packages
          if-no-files-found: error

      # No --skip-duplicate: a version that already exists must fail the run,
      # not pass it. Core and Generated go first, then the Facade that needs them.
      - name: Push to GitHub Packages
        if: inputs.push
        env:
          NUGET_FEED_TOKEN: ${{ github.token }}
        run: |
          foreach ($id in 'RIoT.Sdk.Core', 'RIoT.Sdk.Generated', 'RIoT.Sdk.Facade') {
            $package = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/packages" -Filter "$id.*.nupkg" | Select-Object -First 1
            dotnet nuget push $package.FullName --api-key $env:NUGET_FEED_TOKEN --source $env:FEED
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
