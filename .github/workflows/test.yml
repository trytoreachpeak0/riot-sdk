name: test

# Runs on the self-hosted runner on win11-01 (factory server Hyper-V guest).
# There is no hosted-runner fallback: this workspace deliberately does not use
# GitHub-hosted runners. See the workspace root CLAUDE.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never cancel a running job here. Cancelling one on a self-hosted runner also
# cancels the runner's broker long-poll; the backoff retries exhaust and the
# session wedges without self-healing. Measured on 2026-09-03: 4 hours 14 minutes
# of dead CI, recovered only when GitHub pushed a RunnerRefreshConfigMessage.
# Each repository has exactly one runner, so a wedged session is that
# repository's entire CI. A duplicate two-minute run is the cheaper outcome.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: [self-hosted, headless]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: dotnet --info
        shell: pwsh
        run: dotnet --info

      # Never assert on dotnet's console output here: the guest's locale is
      # zh-CN and it prints 已通过! rather than Passed!. The exit code is the
      # contract.
      - name: Test
        shell: pwsh
        run: dotnet test csharp/RIoT.Sdk.Tests -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn
